<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number Generator — 3D Dice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Random Number Generator</h1>
    <p class="subtitle">Set your odds, throw the die, see your number.</p>

    <form id="odds-form" class="controls">
      <label for="odds-input">
        1 out of
        <input id="odds-input" name="odds" type="number" min="1" step="1" value="6" required />
      </label>
      <button type="submit" id="roll-button">Roll</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="scene">
      <div id="dice" class="dice">
        <div class="face front">1</div>
        <div class="face back">2</div>
        <div class="face right">3</div>
        <div class="face left">4</div>
        <div class="face top">5</div>
        <div class="face bottom">6</div>
      </div>
    </div>

    <p id="result" class="result" aria-live="polite">Press Roll to throw the die.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
