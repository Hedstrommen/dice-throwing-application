<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice thrower</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Dice thrower</h1>
    <p class="subtitle">Set your odds, throw the die, see your number.</p>

    <form id="odds-form" class="controls">
      <label for="odds-input">
        1 out of
        <input id="odds-input" name="odds" type="number" min="1" step="1" value="6" required />
      </label>
      <button type="submit" id="roll-button">Roll</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <canvas id="scene-canvas" width="360" height="360" aria-label="3D die"></canvas>

    <p id="result" class="result" aria-live="polite">Press Roll to throw the die.</p>
  </main>

  <script type="module" src="src/presentation/main.js"></script>
</body>
</html>
