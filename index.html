<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2b3a55" />
  <meta name="description" content="Dice thrower — throw 3D dice and see your numbers." />
  <title>Dice thrower</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <main class="app">
    <h1>Dice thrower</h1>
    <p class="subtitle">Set your odds, throw the die, see your number.</p>

    <form id="odds-form" class="controls">
      <label for="amount-input">
        Dice
        <input id="amount-input" name="amount" type="number" min="1" max="10" step="1" value="1" required />
      </label>
      <label for="type-input">
        Sides
        <input id="type-input" name="type" type="number" min="1" step="1" value="6" required />
      </label>
      <button type="submit" id="roll-button">Roll</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <canvas id="scene-canvas" width="360" height="360" aria-label="3D die"></canvas>

    <p id="result" class="result" aria-live="polite">Press Roll to throw the dice.</p>
  </main>

  <script type="module" src="src/presentation/main.js"></script>
</body>
</html>
