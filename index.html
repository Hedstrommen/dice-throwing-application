<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number Generator — 3D Dice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Random Number Generator</h1>
    <p class="subtitle">Set your odds, throw the die, see your number.</p>

    <form id="odds-form" class="controls">
      <label for="amount-input">
        Dice
        <input id="amount-input" name="amount" type="number" min="1" max="10" step="1" value="1" required />
      </label>
      <label for="type-input">
        Type
        <select id="type-input" name="type">
          <option value="2">Coin (d2)</option>
          <option value="4">d4</option>
          <option value="6" selected>d6</option>
          <option value="8">d8</option>
          <option value="10">d10</option>
          <option value="12">d12</option>
          <option value="20">d20</option>
        </select>
      </label>
      <button type="submit" id="roll-button">Roll</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <canvas id="scene-canvas" width="360" height="360" aria-label="3D die"></canvas>

    <p id="result" class="result" aria-live="polite">Press Roll to throw the dice.</p>
  </main>

  <script src="solids.js"></script>
  <script src="script.js"></script>
</body>
</html>
